# Pizza Order Tracker - workshop stack
#
# Compose reads variable values (DASH0_AUTH_TOKEN, DASH0_ENDPOINT, SLOW_KITCHEN,
# NO_DRIVERS, ...) from the `.env` file that sits NEXT TO THIS FILE, i.e.
# `pizza-app/.env`. Create it from inside pizza-app/:
#
#     cp .env.template .env
#
# An `.env` anywhere else (the repo root, for example) is NOT read.

x-otel-node: &otel-node
  NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance,container
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=pizza-app,deployment.environment.name=${DASH0_ENVIRONMENT:-workshop}

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - DASH0_ENDPOINT=${DASH0_ENDPOINT:?set DASH0_ENDPOINT in pizza-app/.env}
      - DASH0_AUTH_TOKEN=${DASH0_AUTH_TOKEN:?set DASH0_AUTH_TOKEN in pizza-app/.env}
      - DASH0_DATASET=${DASH0_DATASET:-default}
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "3000:3000"
    environment:
      <<: *otel-node
      OTEL_SERVICE_NAME: order-service
      KITCHEN_SERVICE_URL: http://kitchen-service:3001
      DELIVERY_SERVICE_URL: http://delivery-service:3002
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      kitchen-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  kitchen-service:
    build: ./kitchen-service
    ports:
      - "3001:3001"
    environment:
      <<: *otel-node
      OTEL_SERVICE_NAME: kitchen-service
      SLOW_KITCHEN: ${SLOW_KITCHEN:-false}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_started

  delivery-service:
    build: ./delivery-service
    ports:
      - "3002:3002"
    environment:
      <<: *otel-node
      OTEL_SERVICE_NAME: delivery-service
      NO_DRIVERS: ${NO_DRIVERS:-false}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      order-service:
        condition: service_healthy
